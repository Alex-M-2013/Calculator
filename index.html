<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Calculator</h1>

    <div class="calculator-card">
        <p id="output"></p>

        <div class="button-grid">
            <button onclick="userInput += '1'; updateDisplay()">1</button>
            <button onclick="userInput += '2'; updateDisplay()">2</button>
            <button onclick="userInput += '3'; updateDisplay()">3</button>
            <button onclick="userInput += '+'; updateDisplay()">+</button>

            <button onclick="userInput += '4'; updateDisplay()">4</button>
            <button onclick="userInput += '5'; updateDisplay()">5</button>
            <button onclick="userInput += '6'; updateDisplay()">6</button>
            <button onclick="userInput += '-'; updateDisplay()">-</button>

            <button onclick="userInput += '7'; updateDisplay()">7</button>
            <button onclick="userInput += '8'; updateDisplay()">8</button>
            <button onclick="userInput += '9'; updateDisplay()">9</button>
            <button onclick="userInput += '*'; updateDisplay()">x</button>

            <button id="calculate" onclick="calculate()">Calculate</button>
            <button id="divide" onclick="userInput += '/'; updateDisplay()">÷</button>

            <button id="clear" onclick="userInput = ''; updateDisplay()">Clear</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
